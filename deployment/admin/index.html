<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCNT Vault - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
  --color-primary: #1a1a1a;
  --color-primary-hover: #2d2d2d;
  --color-text-inverse: #f8f6f1;
  --color-accent: #8b7355;
  --color-accent-light: #c4a882;
  --color-accent-subtle: rgba(139,115,85,0.08);
  --color-bg: #f8f6f1;
  --color-bg-warm: #f1efe7;
  --color-bg-card: #ffffff;
  --color-surface: #faf9f6;
  --color-text: #1a1a1a;
  --color-text-secondary: #6b6b6b;
  --color-text-tertiary: #999999;
  --color-border: #e8e5de;
  --color-border-subtle: #f0ede6;
  --color-danger: #dc2626;
  --color-success: #059669;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 48px rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  min-height: 100vh;
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════════
   LOGIN — Split Panel
   ══════════════════════════════════════════ */
.login-wrapper {
  display: flex; min-height: 100vh;
}
.login-brand {
  flex: 1; background: #000; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.login-brand::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(139,115,85,0.15) 0%, transparent 60%);
}
.login-brand-content {
  position: relative; z-index: 1; text-align: center; padding: 40px;
}
.login-logo {
  width: 80px; height: 80px; margin: 0 auto 28px;
}
.login-brand-name {
  font-family: var(--font-display); font-size: 32px; font-weight: 800;
  color: #e8e4dc; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 16px;
}
.login-brand-divider {
  width: 48px; height: 2px; margin: 0 auto 20px;
  background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
}
.login-brand-tagline {
  font-size: 14px; color: rgba(232,228,220,0.4); line-height: 1.6; max-width: 260px;
}

.login-form-panel {
  flex: 1; background: var(--color-bg-warm); display: flex;
  align-items: center; justify-content: center; padding: 40px;
}
.login-card {
  background: var(--color-bg-card); padding: 44px 40px; border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 400px;
  border: 1px solid var(--color-border);
}
.login-card h2 {
  font-family: var(--font-display); font-size: 24px; font-weight: 800;
  margin-bottom: 6px; color: var(--color-text);
}
.login-card > p {
  color: var(--color-text-secondary); margin-bottom: 28px; font-size: 14px;
}
.login-input-wrap {
  position: relative; margin-bottom: 16px;
}
.login-input-wrap .input-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--color-text-tertiary); font-size: 14px; pointer-events: none;
}
.login-card input[type="email"],
.login-card input[type="password"] {
  width: 100%; padding: 13px 14px 13px 42px;
  border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font-body); outline: none;
  background: var(--color-surface); transition: border-color 0.2s, box-shadow 0.2s;
}
.login-card input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(139,115,85,0.1);
  background: #fff;
}
.btn-login {
  width: 100%; padding: 13px;
  background: var(--color-primary); color: var(--color-text-inverse);
  border: 1.5px solid var(--color-primary); border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; font-family: var(--font-body);
  cursor: pointer; transition: all 0.25s var(--ease-out); margin-top: 4px;
}
.btn-login:hover {
  background: var(--color-primary-hover); transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.error-message {
  text-align: center; margin-top: 14px; font-size: 13px; min-height: 18px; color: var(--color-danger);
}
.login-footer {
  text-align: center; margin-top: 32px; font-size: 12px; color: var(--color-text-tertiary);
}

@media (max-width: 768px) {
  .login-brand { display: none; }
  .login-form-panel { padding: 24px; }
  .login-card { padding: 32px 28px; }
}

/* ══════════════════════════════════════════
   ADMIN LAYOUT
   ══════════════════════════════════════════ */
.admin-container { display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 240px; min-width: 240px;
  background: var(--color-primary);
  display: flex; flex-direction: column;
  position: fixed; height: 100vh; z-index: 100;
  box-shadow: 4px 0 24px rgba(0,0,0,0.3);
  transition: transform 0.3s var(--ease-out);
}
.sidebar-header {
  padding: 24px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sidebar-brand {
  display: flex; align-items: center; gap: 12px;
}
.sidebar-brand-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--color-accent-subtle); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-brand-icon svg { width: 20px; height: 20px; }
.sidebar-header h2 {
  font-family: var(--font-display); color: #e8e4dc;
  font-size: 16px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase;
}
.user-section {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
}
.user-avatar {
  width: 30px; height: 30px; border-radius: var(--radius-full);
  background: rgba(139,115,85,0.2); color: var(--color-accent-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.user-email {
  font-size: 11px; color: rgba(255,255,255,0.35); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

.nav-menu { list-style: none; padding: 16px 8px; flex: 1; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 2px;
  color: rgba(255,255,255,0.45); text-decoration: none;
  font-size: 13px; font-weight: 500; transition: all 0.2s;
  border-left: 3px solid transparent;
}
.nav-link:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.nav-link.active {
  background: rgba(139,115,85,0.12); color: var(--color-accent-light);
  font-weight: 600; border-left-color: var(--color-accent);
}
.nav-link .nav-icon { width: 18px; text-align: center; font-size: 14px; }

.sidebar-footer {
  padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06);
}
.btn-logout {
  width: 100%; padding: 10px 14px;
  background: rgba(220,38,38,0.08); color: #fca5a5;
  border: 1px solid rgba(220,38,38,0.15); border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font-body);
  transition: all 0.2s; display: flex; align-items: center; gap: 8px;
}
.btn-logout:hover { background: rgba(220,38,38,0.15); }

.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 99;
}

/* ── Hamburger ── */
.hamburger {
  display: none; background: none; border: none;
  font-size: 22px; cursor: pointer; color: var(--color-text);
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  transition: background 0.2s;
}
.hamburger:hover { background: var(--color-border-subtle); }

/* ── Main Content ── */
.main-content {
  margin-left: 240px; flex: 1; display: flex;
  flex-direction: column; min-height: 100vh;
}
.top-bar {
  background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
  padding: 0 28px; height: 64px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--color-border-subtle);
}
.top-bar-left { display: flex; align-items: center; gap: 12px; }
.top-bar h1 {
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  color: var(--color-text);
}
.top-bar-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 36px; height: 36px; border: 1px solid var(--color-border);
  background: var(--color-bg-card); border-radius: var(--radius-sm);
  cursor: pointer; font-size: 15px; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: var(--color-surface); border-color: var(--color-accent); }

.content-area {
  padding: 28px; flex: 1; background: var(--color-bg-warm);
  transition: opacity 0.2s ease;
}
.content-area.transitioning { opacity: 0; }

/* ══════════════════════════════════════════
   SHARED COMPONENTS
   ══════════════════════════════════════════ */

/* ── Stats ── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: var(--color-bg-card); padding: 20px 22px;
  border-radius: var(--radius-lg); border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-sm); transition: all 0.25s var(--ease-out);
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.stat-card h3 {
  font-size: 11px; color: var(--color-text-tertiary); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
}
.stat-value {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  color: var(--color-text); margin-bottom: 4px;
}
.stat-change { font-size: 12px; color: var(--color-success); font-weight: 500; }
.stat-change.negative { color: var(--color-danger); }

/* ── Charts ── */
.charts-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
}
.chart-card {
  background: var(--color-bg-card); padding: 20px 22px;
  border-radius: var(--radius-lg); border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-sm);
}
.chart-card h3 {
  font-family: var(--font-display); font-size: 15px; font-weight: 600;
  color: var(--color-text); margin-bottom: 16px;
}
.chart-card canvas { max-height: 220px; }

/* ── Tables ── */
.data-table {
  background: var(--color-bg-card); border-radius: var(--radius-lg);
  overflow: hidden; border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-sm); margin-bottom: 24px;
}
.data-table-header {
  padding: 16px 20px; border-bottom: 1px solid var(--color-border-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.data-table-header h2 {
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
  color: var(--color-text);
}
.data-table table { width: 100%; border-collapse: collapse; }
.data-table th {
  padding: 11px 16px; text-align: left; font-size: 11px;
  font-weight: 700; color: var(--color-text-tertiary); text-transform: uppercase;
  letter-spacing: 0.5px; background: var(--color-surface);
  border-bottom: 2px solid var(--color-border-subtle); white-space: nowrap;
}
.data-table td {
  padding: 13px 16px; border-bottom: 1px solid var(--color-border-subtle);
  font-size: 13px; color: var(--color-text-secondary);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(139,115,85,0.03); }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; padding: 3px 10px;
  border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
}
.badge-success { background: #d1fae5; color: #065f46; }
.badge-warning { background: #fef3c7; color: #92400e; }
.badge-danger  { background: #fee2e2; color: #991b1b; }
.badge-info    { background: #dbeafe; color: #1e40af; }
.badge-primary { background: #ede9fe; color: #6d28d9; }
.badge-secondary { background: var(--color-surface); color: var(--color-text-secondary); }
.badge-accent { background: rgba(139,115,85,0.1); color: var(--color-accent); }

/* ── Buttons ── */
.btn {
  padding: 9px 18px; border: 1.5px solid transparent; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font-body);
  transition: all 0.25s var(--ease-out); display: inline-flex;
  align-items: center; gap: 6px; white-space: nowrap;
}
.btn-primary {
  background: var(--color-primary); color: var(--color-text-inverse);
  border-color: var(--color-primary);
}
.btn-primary:hover {
  background: var(--color-primary-hover); transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-secondary {
  background: var(--color-bg-card); color: var(--color-text-secondary);
  border-color: var(--color-border);
}
.btn-secondary:hover { background: var(--color-surface); border-color: var(--color-accent); }
.btn-accent {
  background: var(--color-primary); color: var(--color-text-inverse);
  border-color: var(--color-primary);
}
.btn-accent:hover {
  background: var(--color-primary-hover); transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn-danger {
  background: #fee2e2; color: #dc2626; border-color: #fecaca;
}
.btn-danger:hover { background: #fecaca; }
.btn-success {
  background: #d1fae5; color: #065f46; border-color: #a7f3d0;
}
.btn-success:hover { background: #a7f3d0; }

.btn-sm {
  padding: 5px 11px; border: none; border-radius: 7px;
  cursor: pointer; font-size: 12px; font-weight: 600; font-family: var(--font-body);
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
}
.btn-sm-edit   { background: rgba(139,115,85,0.1); color: var(--color-accent); }
.btn-sm-edit:hover   { background: rgba(139,115,85,0.18); }
.btn-sm-delete { background: #fee2e2; color: #dc2626; }
.btn-sm-delete:hover { background: #fecaca; }
.btn-sm-view   { background: rgba(139,115,85,0.08); color: var(--color-text-secondary); }
.btn-sm-view:hover   { background: rgba(139,115,85,0.15); }
.btn-sm-status { background: #dbeafe; color: #1e40af; }
.btn-sm-status:hover { background: #bfdbfe; }
.btn-sm-pos { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: white; }
.btn-sm-pos:hover { background: linear-gradient(135deg,#4f46e5,#7c3aed); }

/* ── Toolbar ── */
.toolbar {
  display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
}
.search-input {
  flex: 1; min-width: 200px; padding: 9px 14px;
  border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body); outline: none;
  background: var(--color-bg-card); transition: all 0.2s;
}
.search-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
}
.filter-select {
  padding: 9px 12px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body); outline: none;
  background: var(--color-bg-card); cursor: pointer; transition: all 0.2s;
}
.filter-select:focus { border-color: var(--color-accent); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px); display: flex; align-items: center;
  justify-content: center; z-index: 1000; padding: 20px;
}
.modal-content {
  background: var(--color-bg-card); border-radius: var(--radius-xl);
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-xl); border: 1px solid var(--color-border);
  animation: modalIn 0.25s var(--ease-spring);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 20px 24px; background: var(--color-primary);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 10;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}
.modal-header h2 {
  font-family: var(--font-display); color: var(--color-text-inverse);
  font-size: 16px; font-weight: 600;
}
.modal-close {
  background: rgba(255,255,255,0.1); border: none; border-radius: var(--radius-sm);
  color: var(--color-text-inverse); cursor: pointer; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: background 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--color-border-subtle);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1/-1; }
.form-group label {
  font-size: 11px; font-weight: 700; color: var(--color-text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.form-group input, .form-group select, .form-group textarea {
  padding: 9px 12px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body); outline: none;
  background: var(--color-surface); transition: all 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(139,115,85,0.08);
  background: #fff;
}

/* ── Alert ── */
.alert {
  padding: 12px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.alert-warning { background: #fef3c7; color: #92400e; }
.alert-success { background: #d1fae5; color: #065f46; }
.alert-danger  { background: #fee2e2; color: #991b1b; }

/* ── Info label ── */
.info-label {
  font-size: 11px; font-weight: 700; color: var(--color-text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
}

/* ── Empty state ── */
.empty-state { padding: 48px 20px; text-align: center; color: var(--color-text-tertiary); font-size: 14px; }

/* ══════════════════════════════════════════
   SKELETON LOADING
   ══════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-border-subtle) 50%, var(--color-surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text { height: 14px; margin-bottom: 8px; }
.skeleton-title { height: 28px; width: 60%; margin-bottom: 12px; }
.skeleton-card { height: 100px; border-radius: var(--radius-lg); margin-bottom: 16px; }
.skeleton-row {
  display: flex; gap: 16px; padding: 14px 16px;
  border-bottom: 1px solid var(--color-border-subtle);
}
.skeleton-row .skeleton { flex: 1; height: 14px; }
.skeleton-row .skeleton:nth-child(1) { flex: 2; }

/* ══════════════════════════════════════════
   TOAST NOTIFICATIONS
   ══════════════════════════════════════════ */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 10000;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  padding: 14px 20px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600; font-family: var(--font-body);
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.3s var(--ease-spring);
  min-width: 280px; max-width: 400px; color: #fff;
}
.toast-success { background: #065f46; border-left: 4px solid #10b981; }
.toast-error { background: #991b1b; border-left: 4px solid #ef4444; }
.toast-info { background: var(--color-primary); border-left: 4px solid var(--color-accent); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ══════════════════════════════════════════
   CONFIRM DIALOG
   ══════════════════════════════════════════ */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px); display: flex; align-items: center;
  justify-content: center; z-index: 10001; padding: 20px;
}
.confirm-card {
  background: var(--color-bg-card); border-radius: var(--radius-xl);
  padding: 32px; max-width: 400px; width: 90%; box-shadow: var(--shadow-xl);
  text-align: center; border: 1px solid var(--color-border);
  animation: modalIn 0.25s var(--ease-spring);
}
.confirm-card h3 {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  margin-bottom: 8px; color: var(--color-text);
}
.confirm-card p {
  font-size: 14px; color: var(--color-text-secondary); margin-bottom: 24px; line-height: 1.5;
}
.confirm-actions { display: flex; gap: 12px; justify-content: center; }

/* ── Status Picker ── */
.status-picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.status-pill {
  padding: 8px 16px; border-radius: var(--radius-full);
  border: 1.5px solid var(--color-border); background: var(--color-bg-card);
  cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font-body);
  transition: all 0.2s; text-transform: capitalize;
}
.status-pill:hover { border-color: var(--color-accent); background: var(--color-accent-subtle); }
.status-pill.active {
  background: var(--color-primary); color: var(--color-text-inverse);
  border-color: var(--color-primary);
}

/* ══════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════ */
@media (max-width: 768px) {
  .hamburger { display: block; }
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.active { display: block; }
  .main-content { margin-left: 0; }
  .top-bar { padding: 0 16px; }
  .content-area { padding: 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .data-table { overflow-x: auto; }
  .modal-content { margin: 10px; max-height: 95vh; }
  .toast-container { left: 16px; right: 16px; }
  .toast { min-width: auto; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
}

/* ── Status Timeline ── */
.status-timeline {
  display: flex; align-items: center; gap: 0; margin: 20px 0;
  overflow-x: auto; padding: 4px 0;
}
.timeline-step {
  display: flex; align-items: center; gap: 0; white-space: nowrap;
}
.timeline-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--color-border); background: var(--color-bg-card);
  flex-shrink: 0; transition: all 0.2s;
}
.timeline-dot.completed { background: var(--color-primary); border-color: var(--color-primary); }
.timeline-dot.active { background: var(--color-accent); border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(139,115,85,0.2); }
.timeline-label {
  font-size: 11px; color: var(--color-text-tertiary); margin-left: 6px; margin-right: 6px;
  font-weight: 500;
}
.timeline-label.active { color: var(--color-accent); font-weight: 700; }
.timeline-label.completed { color: var(--color-text); font-weight: 600; }
.timeline-line {
  width: 24px; height: 2px; background: var(--color-border); flex-shrink: 0;
}
.timeline-line.completed { background: var(--color-primary); }

/* ── Quick Actions ── */
.quick-actions {
  display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.quick-action-btn {
  display: flex; align-items: center; gap: 8px;

/* ── Date Range Pills ── */

    <!-- App -->
    <script>
    (function() {
      var auth = FB.auth;
      var db   = FB.db;

      var currentUser  = null;
      var currentPage  = 'dashboard';
      var productsCache  = [];
      var ordersCache    = [];
      var contactsCache  = [];
      var dateRange      = '30';

      /* ═══ TOAST ═══ */
      function showToast(msg, type) {
        type = type || 'info';
        var c = document.getElementById('toastContainer');
        var t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(function() {
          t.style.opacity = '0';
          t.style.transform = 'translateX(40px)';
          t.style.transition = 'all 0.3s ease';
          setTimeout(function() { t.remove(); }, 300);
        }, 3500);
      }

      /* ═══ CONFIRM DIALOG ═══ */
      function showConfirm(title, message, onConfirm) {
        var overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        overlay.innerHTML =
          '<div class="confirm-card">' +
            '<h3>' + title + '</h3>' +
            '<p>' + message + '</p>' +
            '<div class="confirm-actions">' +
              '<button class="btn btn-secondary" id="confirmCancel">Cancel</button>' +
              '<button class="btn btn-danger" id="confirmOk">Confirm</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        overlay.querySelector('#confirmCancel').onclick = function() { overlay.remove(); };
        overlay.querySelector('#confirmOk').onclick = function() { overlay.remove(); onConfirm(); };
        overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      }

      /* ═══ STATUS PICKER ═══ */
      function showStatusPicker(current, onPick) {
        var statuses = ['pending','confirmed','processing','shipped','delivered','cancelled'];
        var overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        var pills = statuses.map(function(s) {
          return '<button class="status-pill' + (s === current ? ' active' : '') + '" data-status="' + s + '">' + s + '</button>';
        }).join('');
        overlay.innerHTML =
          '<div class="confirm-card">' +
            '<h3>Update Status</h3>' +
            '<p>Current: <strong>' + current + '</strong></p>' +
            '<div class="status-picker">' + pills + '</div>' +
            '<div class="confirm-actions" style="margin-top:20px">' +
              '<button class="btn btn-secondary" id="statusCancel">Cancel</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        overlay.querySelectorAll('.status-pill').forEach(function(pill) {
          pill.onclick = function() { overlay.remove(); onPick(pill.dataset.status); };
        });
        overlay.querySelector('#statusCancel').onclick = function() { overlay.remove(); };
        overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      }

      /* ═══ AUTH ═══ */
      function initAuth() {
        auth.onAuthStateChanged(function(user) {
          if (user) { currentUser = user; showAdmin(); loadPage(currentPage); }
          else       { currentUser = null; showLogin(); }
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
          e.preventDefault();
          var err = document.getElementById('errorMessage');
          var btn = document.getElementById('loginBtn');
          btn.textContent = 'Signing in...'; btn.disabled = true;
          err.style.color = 'var(--color-accent)'; err.textContent = 'Signing in...';
          auth.signInWithEmailAndPassword(
            document.getElementById('email').value,
            document.getElementById('password').value
          ).then(function() { err.textContent = ''; btn.textContent = 'Sign In'; btn.disabled = false; })
           .catch(function(ex) {
            btn.textContent = 'Sign In'; btn.disabled = false;
            err.style.color = 'var(--color-danger)';
            err.textContent = ex.code === 'auth/invalid-credential' ? 'Invalid email or password'
              : ex.code === 'auth/too-many-requests' ? 'Too many attempts. Try later.'
              : ex.message;
          });
        });
        document.getElementById('logoutBtn').addEventListener('click', function() {
          auth.signOut().catch(function(e) { console.error(e); });
        });
      }

      function showLogin() {
        document.getElementById('loginContainer').style.display = 'flex';
        document.getElementById('adminContainer').style.display = 'none';
      }
      function showAdmin() {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('adminContainer').style.display = 'flex';
        document.getElementById('userEmail').textContent = currentUser.email;
        document.getElementById('userAvatar').textContent = (currentUser.email || 'A').charAt(0).toUpperCase();
      }

      /* ═══ NAVIGATION ═══ */
      function initNavigation() {
        document.querySelectorAll('.nav-link').forEach(function(link) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.nav-link').forEach(function(l) { l.classList.remove('active'); });
            link.classList.add('active');
            loadPage(link.dataset.page);
            closeSidebar();
          });
        });
        document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
      }

      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
      }
      function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('active');
      }

      /* ═══ PAGE TRANSITIONS ═══ */
      function loadPage(page) {
        currentPage = page;
        document.getElementById('pageTitle').textContent =
          page.charAt(0).toUpperCase() + page.slice(1);
        var area = document.getElementById('contentArea');
        area.classList.add('transitioning');
        setTimeout(function() {
          var map = {
            dashboard: loadDashboard, products: loadProducts, orders: loadOrders,
            contacts: loadContacts, customers: loadCustomers,
            analytics: loadAnalytics, settings: loadSettings
          };
          (map[page] || function() { area.innerHTML = '<p>Page not found</p>'; })(area);
          area.classList.remove('transitioning');
        }, 200);
      }

      /* ═══ HELPERS ═══ */
      var fmt  = function(n) { return '\u20B1' + (n||0).toLocaleString('en-PH'); };
      var fmtD = function(ts) {
        if (!ts) return '\u2014';
        var d = ts && ts.toDate ? ts.toDate() : new Date(ts);
        return isNaN(d) ? '\u2014' : d.toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
      };
      var fmtDT = function(ts) {
        if (!ts) return '\u2014';
        var d = ts && ts.toDate ? ts.toDate() : new Date(ts);
        return isNaN(d) ? '\u2014' : d.toLocaleString('en-PH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
      };
      var orderStatusBadge = function(s) {
        var map = { pending:'warning', confirmed:'info', processing:'primary',
          shipped:'info', delivered:'success', cancelled:'danger' };
        return 'badge-' + (map[(s||'').toLowerCase()] || 'secondary');
      };

      async function getCol(col) {
        var snap = await db.collection(col).get();
        return snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      }
      async function getColOrdered(col, field, dir) {
        dir = dir || 'desc';
        var snap = await db.collection(col).orderBy(field, dir).get();
        return snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      }

      function skeletonRows(n) {
        var h = '';
        for (var i = 0; i < (n||5); i++) h += '<div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
        return h;
      }
      function skeletonCards(n) {
        var h = '';
        for (var i = 0; i < (n||4); i++) h += '<div class="skeleton skeleton-card"></div>';
        return h;
      }

      /* ═══ DASHBOARD ═══ */
      async function loadDashboard(container) {
        container.innerHTML =
          '<div class="stats-grid">' + skeletonCards(4) + '</div>' +
          '<div class="charts-grid">' +
            '<div class="chart-card"><h3>Orders \u2014 Last 30 Days</h3><canvas id="ordersChart"></canvas></div>' +
            '<div class="chart-card"><h3>Orders by Status</h3><canvas id="statusChart"></canvas></div>' +
          '</div>' +
          '<div class="data-table">' +
            '<div class="data-table-header"><h2>Recent Orders</h2>' +
              '<button class="btn btn-secondary btn-sm" onclick="document.querySelector(\'[data-page=orders]\').click()">View All</button>' +
            '</div>' +
            '<table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>' +
            '<tbody id="recentOrdersBody">' + skeletonRows(5) + '</tbody></table>' +
          '</div>';

        try {
          var results = await Promise.all([
            getCol('products'),
            getColOrdered('orders', 'createdAt').catch(function() { return getCol('orders'); }),
            getCol('contacts')
          ]);
          var products = results[0], orders = results[1], contacts = results[2];
          productsCache = products; ordersCache = orders; contactsCache = contacts;

          var pending = orders.filter(function(o) { return (o.status||'pending') === 'pending'; });
          var unread  = contacts.filter(function(c) { return c.status === 'unread'; });
          var thirtyDaysAgo = new Date(Date.now() - 86400000*30);
          var thisMonth = orders.filter(function(o) {
            var d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt||0);
            return d >= thirtyDaysAgo;
          });

          container.querySelector('.stats-grid').innerHTML =
            '<div class="stat-card" style="border-left:3px solid var(--color-accent)">' +
              '<h3>Total Products</h3><div class="stat-value">' + products.length + '</div>' +
              '<div class="stat-change">' + products.filter(function(p){return (p.Stock||0)>0;}).length + ' in stock</div></div>' +
            '<div class="stat-card" style="border-left:3px solid var(--color-success)">' +
              '<h3>Website Orders</h3><div class="stat-value">' + orders.length + '</div>' +
              '<div class="stat-change">' + thisMonth.length + ' this month</div></div>' +
            '<div class="stat-card" style="border-left:3px solid #f59e0b">' +
              '<h3>Pending Orders</h3><div class="stat-value">' + pending.length + '</div>' +
              '<div class="stat-change' + (pending.length > 0 ? ' negative' : '') + '">Needs attention</div></div>' +
            '<div class="stat-card" style="border-left:3px solid #ef4444">' +
              '<h3>New Messages</h3><div class="stat-value">' + unread.length + '</div>' +
              '<div class="stat-change">' + contacts.length + ' total</div></div>';

          buildOrdersChart(orders);
          buildStatusChart(orders);
          renderRecentOrders(orders.slice(0, 10));
        } catch(e) {
          container.innerHTML += '<div class="alert alert-danger">Error: ' + e.message + '</div>';
        }
      }

      function buildOrdersChart(orders) {
        var ctx = document.getElementById('ordersChart'); if (!ctx) return;
        var days = 30, labels = [], data = [];
        for (var i = days-1; i >= 0; i--) {
          var d = new Date(); d.setDate(d.getDate()-i);
          labels.push(d.toLocaleDateString('en-PH',{month:'short',day:'numeric'}));
          data.push(orders.filter(function(o) {
            var od = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt||0);
            return od.toDateString() === d.toDateString();
          }).length);
        }
        new Chart(ctx, { type:'bar', data:{ labels: labels, datasets:[{
          label:'Orders', data: data, backgroundColor:'rgba(139,115,85,0.6)', borderRadius:4
        }]}, options:{ responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} }});
      }

      function buildStatusChart(orders) {
        var ctx = document.getElementById('statusChart'); if (!ctx) return;

        var colors = { pending:'#f59e0b', confirmed:'#8b7355', processing:'#6b6b6b',
          shipped:'#c4a882', delivered:'#059669', cancelled:'#dc2626' };
        new Chart(ctx, { type:'doughnut', data:{
          labels: Object.keys(counts).map(function(s){return s.charAt(0).toUpperCase()+s.slice(1);}),
          datasets:[{ data: Object.values(counts),
            backgroundColor: Object.keys(counts).map(function(s){return colors[s]||'#999';}), borderWidth:2, borderColor:'#fff' }]},
          options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }});

      function renderProducts(list) {
        var tbody = document.getElementById('productsTbody');
        if (!list.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No products found</td></tr>'; return; }
        tbody.innerHTML = list.map(function(p) {
          var low = (p.Stock||0) <= (p.LowStockThreshold||10);
          var vis = p.visible !== false;
          var genderClass = p.Gender==='Men'?'badge-info':p.Gender==='Women'?'badge-primary':'badge-secondary';
          var stockClass = (p.Stock||0) > 10 ? 'badge-success' : (p.Stock||0) >= 5 ? 'badge-warning' : 'badge-danger';
          var thumb = p.ImagePath ? '<img class="product-thumb" src="' + p.ImagePath + '" onerror="this.style.display=\'none\'">' : '';
          return '<tr>' +
            '<td><div class="product-name-cell">' + thumb + '<span style="font-weight:600;color:var(--color-text)">' + (p.Name||'') + '</span></div></td>' +
            '<td>' + (p.Brand||'\u2014') + '</td><td>' + (p.Category||'\u2014') + '</td>' +
            '<td><span class="badge ' + genderClass + '">' + (p.Gender||'\u2014') + '</span></td>' +
            '<td style="font-weight:700;color:var(--color-success)">' + fmt(p.SellingPrice||p.Price||220) + '</td>' +
            '<td><span class="badge ' + stockClass + '">' + (p.Stock||0) + '</span></td>' +
            '<td><span class="badge ' + (vis?'badge-success':'badge-secondary') + '">' + (vis?'Visible':'Hidden') + '</span></td>' +
            '<td><button class="btn-sm btn-sm-edit" onclick="window._editProduct(\'' + p.id + '\')">Edit</button> ' +

      function filterProducts() {
        var q = document.getElementById('searchProducts').value.toLowerCase();
        var g = document.getElementById('filterGender').value;
        var sort = document.getElementById('sortProducts').value;
        var list = productsCache.filter(function(p) {
          return (!q || (p.Name||'').toLowerCase().indexOf(q) >= 0 || (p.Brand||'').toLowerCase().indexOf(q) >= 0) &&
            (!g || p.Gender === g);
        });
        if (sort === 'name-desc') list.sort(function(a,b){return (b.Name||'').localeCompare(a.Name||'');});
        else if (sort === 'price-asc') list.sort(function(a,b){return (a.SellingPrice||a.Price||0)-(b.SellingPrice||b.Price||0);});
        else if (sort === 'price-desc') list.sort(function(a,b){return (b.SellingPrice||b.Price||0)-(a.SellingPrice||a.Price||0);});
        else if (sort === 'stock-asc') list.sort(function(a,b){return (a.Stock||0)-(b.Stock||0);});
        else list.sort(function(a,b){return (a.Name||'').localeCompare(b.Name||'');});
        renderProducts(list);
      }

      function openProductModal(id) {
        var p = id ? productsCache.find(function(x){return x.id===id;}) : null;
        document.getElementById('productModalTitle').textContent = p ? 'Edit Product' : 'Add Product';
        document.getElementById('productId').value = (p&&p.id)||'';
        document.getElementById('productName').value = (p&&p.Name)||'';
        document.getElementById('productBrand').value = (p&&p.Brand)||'';
        document.getElementById('productCategory').value = (p&&p.Category)||'';
        document.getElementById('productGender').value = (p&&p.Gender)||'Unisex';
        document.getElementById('productSize').value = (p&&p.Size)||'85ml';
        document.getElementById('productPrice').value = (p&&(p.SellingPrice||p.Price))||220;
        document.getElementById('productStock').value = (p&&p.Stock)||0;
        document.getElementById('productVisible').value = String(!p || p.visible !== false);
        document.getElementById('productImage').value = (p&&p.ImagePath)||'';
        document.getElementById('productDesc').value = (p&&p.Description)||'';
        document.getElementById('productModal').style.display = 'flex';
      }
      function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

      async function handleProductSave() {
        var id = document.getElementById('productId').value;
        var data = {
          Name: document.getElementById('productName').value,
          Brand: document.getElementById('productBrand').value,
          Category: document.getElementById('productCategory').value,
          Gender: document.getElementById('productGender').value,
          Size: document.getElementById('productSize').value,
          SellingPrice: parseFloat(document.getElementById('productPrice').value)||220,
          Stock: parseInt(document.getElementById('productStock').value)||0,
          visible: document.getElementById('productVisible').value === 'true',
          ImagePath: document.getElementById('productImage').value,
          Description: document.getElementById('productDesc').value,
        };
        try {
          if (id) {
            await db.collection('products').doc(id).update(Object.assign({}, data, { updatedAt: new Date().toISOString() }));
          } else {
            await db.collection('products').add(Object.assign({}, data, { createdAt: new Date().toISOString() }));
          }
          closeProductModal();
          productsCache = await getCol('products');
          renderProducts(productsCache);
          showToast(id ? 'Product updated' : 'Product added', 'success');
        } catch(e) { showToast('Error: ' + e.message, 'error'); }
      }

      window._editProduct = function(id) { openProductModal(id); };
      window._delProduct = function(id, name) {
        showConfirm('Delete Product', 'Are you sure you want to delete "' + name + '"?', async function() {
          await db.collection('products').doc(id).delete().catch(function(e){showToast(e.message,'error');});
          productsCache = await getCol('products');
          renderProducts(productsCache);
          showToast('Product deleted', 'success');
        });
      };

        var statusMap = {unread:'badge-danger',read:'badge-secondary',replied:'badge-success'};
        document.getElementById('ctModalBody').innerHTML =
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">' +
            '<div><div class="info-label">From</div><div style="font-weight:600">' + (c.name||'\u2014') + '</div></div>' +
            '<div><div class="info-label">Date</div><div>' + fmtDT(c.createdAt) + '</div></div>' +
            '<div><div class="info-label">Email</div><div>' + (c.email||'\u2014') + '</div></div>' +
            '<div><div class="info-label">Status</div><span class="badge ' + (statusMap[c.status||'unread']||'badge-secondary') + '">' + (c.status||'unread') + '</span></div>' +
          '</div>' +
          '<div style="background:var(--color-surface);border-radius:var(--radius-md);padding:16px;font-size:14px;line-height:1.6;color:var(--color-text-secondary);white-space:pre-wrap;border:1px solid var(--color-border-subtle)">' + (c.message||'(no message)') + '</div>';
        document.getElementById('ctModalFooter').innerHTML =
          '<button class="btn btn-secondary" onclick="document.getElementById(\'contactModal\').style.display=\'none\'">Close</button>' +
          '<a class="btn btn-secondary" href="mailto:' + (c.email||'') + '?subject=Re: ' + encodeURIComponent(c.subject||'') + '">Reply</a>' +
          '<button class="btn btn-primary" onclick="window._markContact(\'' + id + '\',\'replied\')">Mark Replied</button>';
        document.getElementById('contactModal').style.display = 'flex';
        if (c.status === 'unread') {
          await db.collection('contacts').doc(id).update({ status:'read' }).catch(function(){});
          contactsCache = contactsCache.map(function(x) { return x.id===id ? Object.assign({}, x, {status:'read'}) : x; });
        }
      };

      window._markContact = async function(id, status) {
        await db.collection('contacts').doc(id).update({ status: status }).catch(function(e){showToast(e.message,'error');});
        contactsCache = contactsCache.map(function(x) { return x.id===id ? Object.assign({}, x, {status:status}) : x; });
        document.getElementById('contactModal').style.display = 'none';
        loadContacts(document.getElementById('contentArea'));
        showToast('Marked as ' + status, 'success');
      };

      /* ═══ CUSTOMERS ═══ */
      async function loadCustomers(container) {
        container.innerHTML =
          '<div class="toolbar">' +
            '<input class="search-input" id="custSearch" placeholder="Search by name or email... (press /)">' +
            '<select class="filter-select" id="sortCust"><option value="orders">Most Orders</option><option value="spent">Highest Spent</option><option value="name">Name A-Z</option></select>' +
          '</div>' +
          '<div class="data-table"><div class="data-table-header"><h2>Website Customers</h2>' +
            '<span id="custCount" style="font-size:12px;color:var(--color-text-tertiary)"></span></div>' +
            '<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th><th>Avg Order</th><th>Last Order</th></tr></thead>' +
            '<tbody id="custTbody">' + skeletonRows(5) + '</tbody></table></div>' +
          '<div class="modal-overlay" id="custModal" style="display:none"><div class="modal-content" style="max-width:600px">' +
            '<div class="modal-header"><h2 id="custModalTitle">Customer</h2>' +
              '<button class="modal-close" onclick="document.getElementById(\'custModal\').style.display=\'none\'">&times;</button></div>' +
            '<div class="modal-body" id="custModalBody"></div>' +
            '<div class="modal-footer"><button class="btn btn-secondary" onclick="document.getElementById(\'custModal\').style.display=\'none\'">Close</button></div></div></div>';

        var orders = ordersCache.length ? ordersCache
          : await getColOrdered('orders','createdAt').catch(function(){return getCol('orders');}).catch(function(){return [];});

        var custMap = {};
        orders.forEach(function(o) {
          var email = (o.email||'').toLowerCase() || o.id;
          if (!custMap[email]) custMap[email] = { name: o.fullName||o.name||'\u2014', email: o.email||'\u2014', phone: o.phone||'\u2014', orders:0, spent:0, lastOrder:null, orderList:[] };
          custMap[email].orders++;
          custMap[email].spent += o.total||o.grandTotal||0;
          custMap[email].orderList.push(o);
          var d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt||0);
          if (!custMap[email].lastOrder || d > custMap[email].lastOrder) custMap[email].lastOrder = d;
        });
        var allCustomers = Object.values(custMap);

        var render = function() {
          var q = document.getElementById('custSearch').value.toLowerCase();
          var sort = document.getElementById('sortCust').value;
          var list = allCustomers.filter(function(c) {
            return !q || c.name.toLowerCase().indexOf(q) >= 0 || c.email.toLowerCase().indexOf(q) >= 0;
          });
          if (sort === 'spent') list.sort(function(a,b){return b.spent-a.spent;});
          else if (sort === 'name') list.sort(function(a,b){return a.name.localeCompare(b.name);});
          else list.sort(function(a,b){return b.orders-a.orders;});

          document.getElementById('custCount').textContent = list.length + ' customer(s)';
          var tbody = document.getElementById('custTbody');
          if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No customers found</td></tr>'; return; }
          tbody.innerHTML = list.map(function(c) {
            var avg = c.orders > 0 ? fmt(Math.round(c.spent / c.orders)) : '\u2014';
            return '<tr style="cursor:pointer" onclick="window._viewCustomer(\'' + c.email + '\')">' +
              '<td style="font-weight:600;font-family:var(--font-display)">' + c.name + '</td>' +
              '<td style="color:var(--color-text-tertiary)">' + c.email + '</td>' +
              '<td style="color:var(--color-text-tertiary)">' + c.phone + '</td>' +
              '<td style="text-align:center"><span class="badge badge-accent">' + c.orders + '</span></td>' +
              '<td style="font-weight:700;color:var(--color-success)">' + fmt(c.spent) + '</td>' +
              '<td style="color:var(--color-text-secondary)">' + avg + '</td>' +
              '<td style="color:var(--color-text-tertiary);font-size:12px">' + (c.lastOrder ? fmtD(c.lastOrder) : '\u2014') + '</td></tr>';
          }).join('');
          window._allCustomers = list;
        };
        render();
        document.getElementById('custSearch').oninput = render;
        document.getElementById('sortCust').onchange = render;
      }

      window._viewCustomer = function(email) {
        var list = window._allCustomers || [];
        var c = list.find(function(x){return x.email === email;}); if (!c) return;
        document.getElementById('custModalTitle').textContent = c.name;
        var avg = c.orders > 0 ? fmt(Math.round(c.spent / c.orders)) : '\u2014';
        var recentOrders = c.orderList.slice(-5).reverse().map(function(o) {
          return '<tr><td>' + fmtDT(o.createdAt) + '</td><td><span class="badge ' + orderStatusBadge(o.status) + '">' + (o.status||'pending') + '</span></td><td style="font-weight:600;color:var(--color-success)">' + fmt(o.total||o.grandTotal||0) + '</td></tr>';
        }).join('');
        document.getElementById('custModalBody').innerHTML =
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px">' +
            '<div style="text-align:center;padding:16px;background:var(--color-surface);border-radius:var(--radius-md)"><div class="info-label">Orders</div><div style="font-family:var(--font-display);font-size:24px;font-weight:700">' + c.orders + '</div></div>' +
            '<div style="text-align:center;padding:16px;background:var(--color-surface);border-radius:var(--radius-md)"><div class="info-label">Total Spent</div><div style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--color-success)">' + fmt(c.spent) + '</div></div>' +
            '<div style="text-align:center;padding:16px;background:var(--color-surface);border-radius:var(--radius-md)"><div class="info-label">Avg Order</div><div style="font-family:var(--font-display);font-size:24px;font-weight:700">' + avg + '</div></div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">' +
            '<div><div class="info-label">Email</div><div>' + c.email + '</div></div>' +
            '<div><div class="info-label">Phone</div><div>' + c.phone + '</div></div>' +
            '<div><div class="info-label">Last Order</div><div>' + (c.lastOrder ? fmtD(c.lastOrder) : '\u2014') + '</div></div>' +
          '</div>' +
          (recentOrders ? '<h3 style="font-family:var(--font-display);font-size:15px;margin-bottom:12px">Recent Orders</h3>' +
          '<table style="width:100%;border-collapse:collapse"><thead><tr style="background:var(--color-surface)"><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase">Date</th><th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase">Status</th><th style="padding:8px 12px;text-align:right;font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase">Total</th></tr></thead><tbody>' + recentOrders + '</tbody></table>' : '');
        document.getElementById('custModal').style.display = 'flex';
      };

      /* ═══ ANALYTICS ═══ */
      async function loadAnalytics(container) {
        container.innerHTML =
          '<div class="stats-grid" id="analyticsStats">' + skeletonCards(3) + '</div>' +
          '<div class="charts-grid" style="margin-bottom:24px">' +
            '<div class="chart-card"><h3>Orders per Month</h3><canvas id="monthlyChart" style="max-height:260px"></canvas></div>' +
            '<div class="chart-card"><h3>Top Ordered Products</h3><canvas id="topProdChart" style="max-height:260px"></canvas></div>' +
          '</div>' +
          '<div class="charts-grid">' +
            '<div class="chart-card"><h3>Order Status Breakdown</h3><canvas id="statusPieChart" style="max-height:260px"></canvas></div>' +
            '<div class="chart-card"><h3>Revenue by Month (\u20B1)</h3><canvas id="revenueChart" style="max-height:260px"></canvas></div>' +
          '</div>';

        var orders = ordersCache.length ? ordersCache
          : await getColOrdered('orders','createdAt').catch(function(){return getCol('orders');}).catch(function(){return [];});

        var totalRevenue = 0, totalOrders = orders.length;
        orders.forEach(function(o) { totalRevenue += o.total||o.grandTotal||0; });
        var avgOrder = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;

        var prodCount = {};
        orders.forEach(function(o) { (o.items||o.cartItems||[]).forEach(function(item) {
          var name = item.name||item.Name||item.perfumeName||'Unknown';
          prodCount[name] = (prodCount[name]||0) + (item.quantity||item.Quantity||1);
        }); });
        var topProd = Object.entries(prodCount).sort(function(a,b){return b[1]-a[1];});
        var bestSelling = topProd.length ? topProd[0][0] : '\u2014';

        document.getElementById('analyticsStats').innerHTML =
          '<div class="stat-card" style="border-left:3px solid var(--color-accent)"><h3>Total Revenue</h3><div class="stat-value">' + fmt(totalRevenue) + '</div></div>' +
          '<div class="stat-card" style="border-left:3px solid var(--color-success)"><h3>Avg Order Value</h3><div class="stat-value">' + fmt(avgOrder) + '</div></div>' +
          '<div class="stat-card" style="border-left:3px solid #f59e0b"><h3>Best Seller</h3><div class="stat-value" style="font-size:18px">' + bestSelling.substring(0, 20) + '</div></div>';

        var monthlyOrders = {}, monthlyRevenue = {};
        orders.forEach(function(o) {
          var d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt||0);
          if (isNaN(d)) return;
          var key = d.toLocaleDateString('en-PH',{year:'numeric',month:'short'});
          monthlyOrders[key] = (monthlyOrders[key]||0) + 1;
          monthlyRevenue[key] = (monthlyRevenue[key]||0) + (o.total||o.grandTotal||0);
        });
        var mKeys = Object.keys(monthlyOrders).slice(-6);

        new Chart(document.getElementById('monthlyChart'), {
          type:'bar', data:{ labels:mKeys, datasets:[{
            label:'Orders', data:mKeys.map(function(k){return monthlyOrders[k];}),
            backgroundColor:'rgba(139,115,85,0.6)', borderRadius:6
          }]}, options:{ responsive:true, maintainAspectRatio:false,
            plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} }
        });
        new Chart(document.getElementById('revenueChart'), {
          type:'line', data:{ labels:mKeys, datasets:[{
            label:'Revenue', data:mKeys.map(function(k){return monthlyRevenue[k];}),
            borderColor:'var(--color-accent)', backgroundColor:'rgba(139,115,85,0.06)', tension:.4, fill:true, pointRadius:3
          }]}, options:{ responsive:true, maintainAspectRatio:false,
            plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
        });
        var top10 = topProd.slice(0,10);
        new Chart(document.getElementById('topProdChart'), {
          type:'bar', data:{ labels:top10.map(function(t){return t[0].substring(0,18);}), datasets:[{
            label:'Qty Ordered', data:top10.map(function(t){return t[1];}),
            backgroundColor:'rgba(107,107,107,0.5)', borderRadius:6
          }]}, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
            plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}} }
        });
        var statusCount = {};
        orders.forEach(function(o) { var s=o.status||'pending'; statusCount[s]=(statusCount[s]||0)+1; });
        var colors = {pending:'#f59e0b',confirmed:'#8b7355',processing:'#6b6b6b',shipped:'#c4a882',delivered:'#059669',cancelled:'#dc2626'};
        new Chart(document.getElementById('statusPieChart'), {
          type:'doughnut', data:{
            labels:Object.keys(statusCount).map(function(s){return s.charAt(0).toUpperCase()+s.slice(1);}),
            datasets:[{ data:Object.values(statusCount),
              backgroundColor:Object.keys(statusCount).map(function(s){return colors[s]||'#999';}), borderWidth:2, borderColor:'#fff' }]},
          options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
        });
      }

      /* ═══ SETTINGS ═══ */
      async function loadSettings(container) {
        container.innerHTML =
          '<div style="max-width:560px">' +
            '<div class="data-table" style="margin-bottom:20px"><div class="data-table-header"><h2>Store Settings</h2></div>' +
              '<div style="padding:24px;display:flex;flex-direction:column;gap:18px">' +
                '<div class="form-group"><label>Low Stock Alert Threshold</label>' +
                  '<input type="number" id="settThreshold" value="10" style="max-width:140px">' +
                  '<span style="font-size:12px;color:var(--color-text-tertiary);margin-top:4px">Products below this qty will show as low stock</span></div>' +
                '<div><button class="btn btn-primary" id="applyThresholdBtn">Apply to All Products</button>' +
                  '<span id="settMsg" style="margin-left:12px;font-size:13px;color:var(--color-success)"></span></div>' +
              '</div></div>' +
            '<div class="data-table" style="margin-bottom:20px"><div class="data-table-header"><h2>Data Management</h2></div>' +
              '<div style="padding:24px;display:flex;gap:12px;flex-wrap:wrap">' +
                '<button class="btn btn-secondary" id="exportProductsBtn">Export Products (CSV)</button>' +
                '<button class="btn btn-secondary" id="exportOrdersBtn">Export Orders (CSV)</button>' +
              '</div></div>' +
            '<div class="data-table"><div class="data-table-header"><h2>System Info</h2></div>' +
              '<div style="padding:20px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--color-text-secondary)">' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Firebase Project</span><span style="font-weight:600">scnt-vault</span></div>' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Store URL</span><a href="https://scnt-vault.web.app" target="_blank" style="color:var(--color-accent);font-weight:600;text-decoration:none">scnt-vault.web.app</a></div>' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Logged in as</span><span style="font-weight:600">' + (currentUser?currentUser.email:'\u2014') + '</span></div>' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Currency</span><span style="font-weight:600">Philippine Peso (\u20B1)</span></div>' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Products</span><span style="font-weight:600">' + productsCache.length + '</span></div>' +
                '<div style="display:flex;justify-content:space-between"><span style="color:var(--color-text-tertiary)">Orders</span><span style="font-weight:600">' + ordersCache.length + '</span></div>' +
              '</div></div>' +
          '</div>';

        document.getElementById('applyThresholdBtn').onclick = async function() {
          var thresh = parseInt(document.getElementById('settThreshold').value)||10;
          var msg = document.getElementById('settMsg');
          msg.textContent = 'Saving...'; msg.style.color = 'var(--color-accent)';
          try {
            var products = await getCol('products');
            var batch = db.batch();
            products.forEach(function(p) {
              batch.update(db.collection('products').doc(p.id), { LowStockThreshold: thresh });
            });
            await batch.commit();
            msg.textContent = 'Applied to ' + products.length + ' products'; msg.style.color = 'var(--color-success)';
            showToast('Threshold updated for ' + products.length + ' products', 'success');
            setTimeout(function(){msg.textContent='';}, 3000);
          } catch(e) { msg.textContent = 'Error: '+e.message; msg.style.color = 'var(--color-danger)'; }
        };

        document.getElementById('exportProductsBtn').onclick = function() {
          if (!productsCache.length) { showToast('No products to export', 'error'); return; }
          var csv = 'Name,Brand,Category,Gender,Size,Price,Stock,Visible\n';
          productsCache.forEach(function(p) {
            csv += '"' + (p.Name||'').replace(/"/g,'""') + '","' + (p.Brand||'') + '","' + (p.Category||'') + '","' + (p.Gender||'') + '","' + (p.Size||'') + '",' + (p.SellingPrice||p.Price||0) + ',' + (p.Stock||0) + ',' + (p.visible!==false) + '\n';
          });
          downloadCSV(csv, 'products.csv');
          showToast('Products exported', 'success');
        };

        document.getElementById('exportOrdersBtn').onclick = function() {
          if (!ordersCache.length) { showToast('No orders to export', 'error'); return; }
          var csv = 'Date,Customer,Email,Phone,Total,Status\n';
          ordersCache.forEach(function(o) {
            csv += '"' + fmtDT(o.createdAt) + '","' + (o.fullName||o.name||'') + '","' + (o.email||'') + '","' + (o.phone||'') + '",' + (o.total||o.grandTotal||0) + ',"' + (o.status||'pending') + '"\n';
          });
          downloadCSV(csv, 'orders.csv');
          showToast('Orders exported', 'success');
        };
      }

      function downloadCSV(csv, filename) {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
      }

      /* ═══ KEYBOARD SHORTCUTS ═══ */
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'SELECT') {
          e.preventDefault();
          var search = document.querySelector('.search-input');
          if (search) search.focus();
        }
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-overlay').forEach(function(m) { m.style.display = 'none'; });
          document.querySelectorAll('.confirm-overlay').forEach(function(m) { m.remove(); });
          closeSidebar();
        }
      });

      /* ═══ INIT ═══ */
      document.addEventListener('DOMContentLoaded', function() {
        initAuth();
        initNavigation();
      });
    })();
    </script>
</body>
</html>
